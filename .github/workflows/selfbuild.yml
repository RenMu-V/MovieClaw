name: selfbuild-manual
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Policy checks
        run: |
          python tests/selfbuild_policy_test.py
          bash -n docker/entrypoint.sh
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          shm-size: 2g
          push: true
          tags: |
            ghcr.io/renmu-v/movieclaw:latest
            ghcr.io/renmu-v/movieclaw:selfbuild-${{ github.sha }}
            shenmu/movieclaw:latest
            shenmu/movieclaw:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/RenMu-V/MovieClaw
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify pushed artifact
        env:
          IMAGE: ghcr.io/renmu-v/movieclaw@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE"
          docker run --rm --entrypoint /entrypoint.sh "$IMAGE" resolve
          docker run --rm --entrypoint /usr/local/bin/movieclaw-subtitle-smoke-test "$IMAGE"
          echo "GHCR: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "DockerHub: shenmu/movieclaw:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
