name: selfbuild-arm64-manual
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Policy and architecture checks
        run: |
          test "$(uname -m)" = aarch64
          python tests/selfbuild_policy_test.py
          bash -n docker/entrypoint.sh
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/arm64
          shm-size: 2g
          push: true
          tags: |
            shenmu/movieclaw:arm64-library-cover-${{ github.sha }}
            ghcr.io/renmu-v/movieclaw:arm64-library-cover-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/RenMu-V/MovieClaw
            org.opencontainers.image.revision=${{ github.sha }}
            de.sttss.movieclaw.base_revision=8e0a58a3c21e2470faa3dfbda8aa2980ab819377
      - name: Verify pushed artifact
        env:
          IMAGE: shenmu/movieclaw@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE"
          test "$(docker image inspect "$IMAGE" --format '{{.Architecture}}')" = arm64
          docker run --rm --entrypoint /entrypoint.sh "$IMAGE" resolve
          docker run --rm --entrypoint /usr/local/bin/movieclaw-subtitle-smoke-test "$IMAGE"
          echo "DockerHub: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
